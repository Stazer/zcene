[config]
default_to_workspace = false

[env]
CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=true

[tasks.test-bare]
args = [
    "test",
    "--package", "zcene-bare",
]
command = "cargo"

[tasks.run-example]
args = [
    "run",
    "--package", "example-${EXAMPLE}",
    "--release",
]
command = "cargo"

[tasks.build-example-x86_64]
script_runner = "@shell"
script = '''
set -e

ARGS="--release --target zcene/x86_64.json -Z build-std=core,compiler_builtins -Z build-std-features=compiler-builtins-mem -Z json-target-spec"

# The programs in `src/bin` come first: the kernel includes their images.
IMAGES="target/x86_64/images/example-${EXAMPLE}"

for file in examples/${EXAMPLE}/src/bin/*.rs; do
    [ -e "${file}" ] || continue

    cargo build --package "example-${EXAMPLE}" --bin "$(basename "${file}" .rs)" ${ARGS} \
        -Z unstable-options --artifact-dir "${IMAGES}"
done

cargo build --package "example-${EXAMPLE}" --bin "example-${EXAMPLE}" ${ARGS}
ZCENE_IMAGE_BINARY="example-${EXAMPLE}" cargo build --package examples-image ${ARGS}
'''

[tasks.run-example-x86_64-uefi]
env = { IMAGE_BINARY = "example-${EXAMPLE}" }
run_task = [{ name = ["build-example-x86_64", "qemu-x86_64-uefi"] }]

[tasks.qemu-x86_64-uefi.env]
KVM = { value = "false", condition = { env_not_set = ["KVM"] } }

[tasks.qemu-x86_64-uefi]
script_runner = "@shell"
script = '''
if [ "${KVM}" = "true" ]; then
    ACCEL_ARGS="-enable-kvm -cpu host"
else
    ACCEL_ARGS="-cpu qemu64"
fi

qemu-system-x86_64 \
    -no-reboot \
    -nographic \
    ${ACCEL_ARGS} \
    -drive format=raw,unit=1,file=target/x86_64/release/${IMAGE_BINARY}-x86_64-uefi.img \
    -drive if=pflash,format=raw,unit=0,file=QEMU_UEFI_CODE-x86_64.fd \
    -nic none \
    -m 1024 \
    -smp 2
'''

[tasks.prepare-x86_64-uefi]
args = [
     "-o",
     "QEMU_UEFI_CODE-x86_64.fd",
     "https://retrage.github.io/edk2-nightly/bin/RELEASEX64_OVMF_CODE.fd",
]
command = "curl"

[tasks.clean]
command = "cargo"
args = ["clean"]
