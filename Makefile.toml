[config]
default_to_workspace = false

[env]
CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=true

[tasks.test-bare]
args = [
    "test",
    "--package", "zcene-bare",
]
command = "cargo"

[tasks.build-playground]
args = [
    "build",
    "--package", "zcene-playground",
    "--release",
    "--target", "zcene/x86_64.json",
    "-Z", "build-std=core,alloc,compiler_builtins",
    "-Z", "build-std-features=compiler-builtins-mem",
    "-Z", "json-target-spec",
]
command = "cargo"

[tasks.build-playground-x86_64]
args = [
    "build",
    "--package", "zcene-playground-x86_64",
    "--release",
    "--target", "zcene/x86_64.json",
    "-Z", "build-std=core,alloc,compiler_builtins",
    "-Z", "build-std-features=compiler-builtins-mem",
    "-Z", "json-target-spec",
]
command = "cargo"
dependencies = [
    "build-playground",
]

[tasks.build-playground-hosted]
args = [
    "build",
    "--package", "zcene-playground",
    "--release",
]
command = "cargo"

[tasks.run-playground-hosted]
args = [
    "run",
    "--package", "zcene-playground",
    "--release",
]
command = "cargo"

[tasks.run-example-migration]
args = [
    "run",
    "--package", "examples",
    "--example", "migration",
]
command = "cargo"

[tasks.run-example-lookup]
args = [
    "run",
    "--package", "examples",
    "--example", "lookup",
]
command = "cargo"

[tasks.run-playground-x86_64-uefi.env]
KVM = { value = "false", condition = { env_not_set = ["KVM"] } }

# Runs under plain TCG software emulation by default. Pass `--env KVM=true` to accelerate
# with KVM and `-cpu host` instead.
[tasks.run-playground-x86_64-uefi]
script_runner = "@shell"
script = '''
if [ "${KVM}" = "true" ]; then
    ACCEL_ARGS="-enable-kvm -cpu host"
else
    ACCEL_ARGS="-cpu qemu64"
fi

qemu-system-x86_64 \
    -no-reboot \
    -nographic \
    ${ACCEL_ARGS} \
    -drive format=raw,unit=1,file=target/x86_64/release/zcene-playground-x86_64-uefi.img \
    -drive if=pflash,format=raw,unit=0,file=QEMU_UEFI_CODE-x86_64.fd \
    -nic none \
    -m 1024 \
    -smp 2
'''
dependencies = [
    "build-playground-x86_64",
]

[tasks.prepare-playground-x86_64-uefi]
args = [
     "-o",
     "QEMU_UEFI_CODE-x86_64.fd",
     "https://retrage.github.io/edk2-nightly/bin/RELEASEX64_OVMF_CODE.fd",
]
command = "curl"

[tasks.clean]
command = "cargo"
args = ["clean"]
