[package]
name = "examples"
version = "0.0.0"
edition = "2021"

[target.'cfg(target_os = "none")'.dependencies]
zcene = { path = "zcene", default-features = false, features = ["x86_64"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
zcene = { path = "zcene", default-features = false, features = ["hosted"] }

[workspace]
resolver = "2"
members = [
    "zcene-core",
    "zcene",
    "zcene-playground",
    "zcene-playground-x86_64",
]

[patch.crates-io]
# Upstream 0.5.0 uses the removed `ptr_internals`/`core::ptr::Unique` nightly
# API; patched locally to use `core::ptr::NonNull` instead.
x2apic = { path = "vendor/x2apic" }
