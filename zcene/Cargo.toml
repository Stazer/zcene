[package]
name = "zcene"
version = "0.0.0"
edition = "2024"

[features]
default = ["x86_64"]
x86_64 = [
    "dep:acpi",
    "dep:bootloader-x86_64-common",
    "dep:bootloader_api",
    "dep:linked_list_allocator",
    "dep:pc-keyboard",
    "dep:pic8259",
    "dep:x2apic",
    "dep:x86",
    "dep:x86_64",
]
hosted = []

[dependencies]
acpi = { version = "5", default-features = false, optional = true }
bootloader-x86_64-common = { version = "*", optional = true }
bootloader_api = { version = "*", optional = true }
linked_list_allocator = { version = "*", optional = true }
log = "*"
pc-keyboard = { version = "*", optional = true }
pic8259 = { version = "*", optional = true }
x2apic = { version = "*", optional = true }
x86 = { version = "*", optional = true }
x86_64 = { version = "0.15", features = ["abi_x86_interrupt", "instructions"], optional = true }
zcene-core = { path = "../zcene-core" }
spin = "*"
ztd = { git = "https://github.com/Stazer/ztd.git" }
