# Vendored from concurrent-queue 2.5.0 (Apache-2.0 OR MIT) and modified to thread the
# `allocator_api` `Allocator` through the queue (see the `*_in` constructors).
[package]
edition = "2021"
name = "concurrent-queue"
version = "2.5.0"
description = "Concurrent multi-producer multi-consumer queue (vendored, allocator_api)"
license = "Apache-2.0 OR MIT"

[lib]
bench = false

[dependencies.crossbeam-utils]
version = "0.8.11"
default-features = false

[dependencies.portable-atomic]
version = "1"
optional = true
default-features = false

[features]
default = []
std = []
