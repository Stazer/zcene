# Vendored from futures-channel 0.3.32 (MIT OR Apache-2.0), trimmed to the mpsc module and
# modified to be `no_std` and to thread the `allocator_api` `Allocator` through the channel
# (see the `*_in` constructors). oneshot / lock / sink_impl were dropped.
[package]
edition = "2021"
name = "futures-channel"
version = "0.3.32"
description = "Async mpsc channel (vendored from futures-channel, no_std + allocator_api)"
license = "MIT OR Apache-2.0"

[lib]
name = "futures_channel"
path = "src/lib.rs"

[dependencies.futures-core]
version = "0.3"
default-features = false

[dependencies.spin]
version = "0.9"
default-features = false
features = ["spin_mutex"]
